name: Steps
options:
  bundleIdPrefix: com.steps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Steps:
    type: application
    platform: iOS
    sources:
      - path: Steps
        excludes:
          - Info.plist
          - Steps.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steps.today
        PRODUCT_NAME: Steps
        INFOPLIST_FILE: Steps/Info.plist
        CODE_SIGN_ENTITLEMENTS: Steps/Steps.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSMotionUsageDescription: Steps uses the motion coprocessor to count steps, distance, and active time while you walk.
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Steps/Steps.entitlements
    info:
      path: Steps/Info.plist
